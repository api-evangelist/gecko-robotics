aid: gecko-robotics
name: Gecko Robotics
description: 'Gecko Robotics is a Pittsburgh, Pennsylvania based AI and robotics company
  that inspects and manages critical physical infrastructure. Its wall-climbing, aerial
  and submersible robots capture full-coverage ultrasonic, visual and other sensor
  readings from boilers, pressure vessels, tanks, pipelines, ship hulls and decks,
  which are fused with facility records and operational data inside Cantilever, the
  company''s AI-powered operating platform for the built world. Cantilever quantifies
  corrosion rates, predicts remaining asset life and prioritizes capital and maintenance
  decisions for customers across defense, power, oil and gas, steel, pulp and paper,
  mining and advanced manufacturing. Cantilever is delivered as a closed, authenticated
  enterprise SaaS at cantilever.app; Gecko Robotics publishes no public developer portal,
  API documentation, SDKs or self-serve API program, and integrations are arranged
  through the company directly.'
